<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Екран автентифікації -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">речі<span>.</span></div>
      <p class="auth-tagline">Пишіть один одному за юзернеймом</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Увійти</button>
        <button class="auth-tab" data-tab="register">Реєстрація</button>
      </div>

      <form id="loginForm" class="auth-form">
        <input type="text" id="loginUsername" placeholder="юзернейм" autocomplete="username" required>
        <input type="password" id="loginPassword" placeholder="пароль" autocomplete="current-password" required>
        <button type="submit">Увійти</button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <input type="text" id="registerUsername" placeholder="юзернейм (лат., цифри, _)" autocomplete="username" required>
        <input type="password" id="registerPassword" placeholder="пароль (мін. 6 символів)" autocomplete="new-password" required>
        <button type="submit">Створити акаунт</button>
      </form>

      <p id="authError" class="auth-error hidden"></p>
    </div>
  </div>

  <!-- Основний застосунок -->
  <div id="appScreen" class="app-screen hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="me" id="meProfileBtn" title="Налаштування профілю">
          <div id="meAvatar" class="avatar-slot"></div>
          <span class="me-username" id="meUsername"></span>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Вийти">⏻</button>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Знайти за юзернеймом…">
        <div id="searchResults" class="search-results hidden"></div>
      </div>

      <div id="chatList" class="chat-list"></div>
    </aside>

    <main class="chat-panel">
      <div id="emptyState" class="empty-state">
        <div class="empty-glyph">✦</div>
        <p>Оберіть чат або знайдіть людину за юзернеймом,<br>щоб почати переписку</p>
      </div>

      <div id="activeChat" class="active-chat hidden">
        <header class="chat-header">
          <div class="chat-header-info">
            <button id="chatBackBtn" class="icon-btn chat-back-btn" title="Назад до списку чатів">←</button>
            <div id="chatHeaderAvatar" class="avatar-slot"></div>
            <div class="chat-header-texts">
              <span id="chatWithUsername"></span>
              <span id="chatHeaderStatus" class="chat-header-status"></span>
            </div>
          </div>
          <div class="chat-header-actions">
            <div class="volume-control">
              <button id="volumeBtn" class="icon-btn" title="Гучність голосових повідомлень">🔊</button>
              <div id="volumePopover" class="volume-popover hidden">
                <span class="volume-popover-label">Гучність голосових</span>
                <input type="range" id="globalVolumeSlider" class="audio-volume" min="0" max="100" value="100">
              </div>
            </div>
            <button id="selectModeBtn" class="icon-btn select-mode-btn" title="Виділити повідомлення">☑</button>
          </div>
        </header>
        <div id="messages" class="messages"></div>
        <div id="selectionBar" class="selection-bar hidden">
          <span id="selectionCount">0 обрано</span>
          <div class="selection-actions">
            <button id="selectionForwardBtn" class="modal-action-btn small">↪ Переслати</button>
            <button id="selectionDeleteBtn" class="modal-action-btn small danger" disabled>🗑 Видалити</button>
            <button id="selectionCancelBtn" class="modal-action-btn small">Скасувати</button>
          </div>
        </div>
        <div id="imagePreview" class="image-preview hidden">
          <img id="imagePreviewImg" alt="Прев'ю">
          <button type="button" id="cancelImageBtn" class="cancel-image-btn">✕</button>
        </div>
        <div id="audioPreview" class="audio-preview hidden">
          <span id="audioPreviewName" class="audio-preview-name"></span>
          <button type="button" id="cancelAudioBtn" class="cancel-image-btn">✕</button>
        </div>
        <div id="videoPreview" class="image-preview hidden">
          <video id="videoPreviewEl" muted></video>
          <button type="button" id="cancelVideoBtn" class="cancel-image-btn">✕</button>
        </div>
        <div id="recordingBar" class="recording-bar hidden">
          <span class="recording-dot"></span>
          <span id="recordingTime" class="recording-time">0:00</span>
          <span class="recording-label">Запис голосового…</span>
          <div class="recording-actions">
            <button type="button" id="recordCancelBtn" class="cancel-image-btn" title="Скасувати">✕</button>
            <button type="button" id="recordSendBtn" class="audio-play-btn" title="Надіслати">➤</button>
          </div>
        </div>
        <form id="messageForm" class="message-form">
          <input type="file" id="imageInput" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden">
          <input type="file" id="audioInput" accept="audio/mpeg,audio/mp3,audio/wav,audio/ogg,audio/webm,audio/mp4,audio/m4a,audio/aac" class="hidden">
          <input type="file" id="videoInput" accept="video/mp4,video/webm,video/quicktime,video/x-matroska" class="hidden">
          <div class="attach-control">
            <button type="button" id="attachBtn" class="attach-btn" title="Прикріпити">📎</button>
            <div id="attachMenu" class="attach-menu hidden">
              <button type="button" class="attach-menu-item" data-action="image"><span>🖼</span> Фото</button>
              <button type="button" class="attach-menu-item" data-action="video"><span>🎬</span> Відео</button>
              <button type="button" class="attach-menu-item" data-action="audio"><span>🎵</span> Аудіофайл</button>
              <button type="button" class="attach-menu-item" data-action="voice"><span>🎙️</span> Голосове</button>
            </div>
          </div>
          <textarea id="messageInput" placeholder="Повідомлення…" rows="1"></textarea>
          <div class="sticker-control">
            <button type="button" id="stickerBtn" class="attach-btn" title="Стікери">😊</button>
            <div id="stickerPopover" class="sticker-popover hidden"></div>
          </div>
          <button type="submit">➤</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Перегляд фото/відео на весь екран -->
  <div id="imageModal" class="image-modal hidden">
    <div class="modal-backdrop" data-close="image"></div>
    <div class="image-modal-content">
      <button id="imageModalClose" class="modal-close-btn" data-close="image">✕</button>
      <img id="imageModalImg" src="" alt="Перегляд фото">
      <video id="imageModalVideo" class="hidden" controls></video>
      <div class="image-modal-actions">
        <button id="imageModalForward" class="modal-action-btn">↪ Переслати</button>
        <a id="imageModalDownload" class="modal-action-btn" download>⬇ Завантажити</a>
      </div>
    </div>
  </div>

  <!-- Вибір чату для пересилання -->
  <div id="forwardModal" class="forward-modal hidden">
    <div class="modal-backdrop" data-close="forward"></div>
    <div class="forward-modal-content">
      <div class="forward-modal-header">
        <span>Переслати до…</span>
        <button id="forwardModalClose" class="icon-btn" data-close="forward">✕</button>
      </div>
      <div id="forwardChatList" class="forward-chat-list"></div>
      <p id="forwardStatus" class="forward-status hidden"></p>
    </div>
  </div>

  <!-- Налаштування профілю -->
  <div id="settingsModal" class="forward-modal hidden">
    <div class="modal-backdrop" data-close="settings"></div>
    <div class="forward-modal-content settings-modal-content">
      <div class="forward-modal-header">
        <span>Налаштування профілю</span>
        <button id="settingsModalClose" class="icon-btn" data-close="settings">✕</button>
      </div>
      <div class="settings-body">
        <div id="settingsAvatar" class="avatar-slot avatar-slot-large"></div>
        <span id="settingsUsername" class="settings-username"></span>
        <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden">
        <div class="settings-actions">
          <button type="button" id="changeAvatarBtn" class="modal-action-btn">🖼 Змінити аватарку</button>
          <button type="button" id="removeAvatarBtn" class="modal-action-btn danger">Видалити аватарку</button>
        </div>
        <label class="settings-toggle-row">
          <span>Показувати мою активність (був(ла) у мережі)</span>
          <input type="checkbox" id="showLastSeenToggle" checked>
        </label>
        <p id="settingsStatus" class="forward-status hidden" style="border:none"></p>
      </div>
    </div>
  </div>

  <!-- Реакції на повідомлення (правий клік) -->
  <div id="reactionPopover" class="reaction-popover hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
